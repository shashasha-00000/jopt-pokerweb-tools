<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ テスト候補版｜取込データ確認</title>
<style>body{font:15px/1.6 system-ui,sans-serif;background:#f3f5f2;color:#172c25;margin:0;padding:24px}header,main{max-width:1180px;margin:auto}h1{font-size:24px}aside,.notice{background:#fff4ce;padding:16px;border-radius:12px}.grid{display:grid;grid-template-columns:320px 1fr;gap:24px;margin-top:24px}section,nav{background:white;padding:20px;border-radius:16px}nav{max-height:70vh;overflow:auto}button{display:block;width:100%;padding:12px;margin:8px 0;border:1px solid #cbd7d0;border-radius:8px;background:#fff;cursor:pointer;text-align:left}button:hover{background:#ecf5ef}.bubble{white-space:pre-wrap;overflow-wrap:anywhere;background:#f0f6f2;padding:20px;border-radius:12px}.warn{color:#9c5014}a{color:#176540}small{color:#5b6f63}input{width:95%;padding:10px}#alert{white-space:pre-wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head>
<body><header><h1>FAQ テスト候補版</h1><aside>ローカルの取込データ確認用です。Harness・LINEには接続していません。状態変更・実際の配信は行いません。</aside><p id="summary">読み込み中…</p><a href="/release.json" download="faq-test-release.json">テスト候補 JSON を保存</a> · <a href="/validation.json">確認事項</a> · <a href="/test-results.json">テスト結果</a></header>
<main class="grid"><nav><input id="q" aria-label="FAQを検索" placeholder="FAQを検索"><div id="list"></div></nav><section><small id="id"></small><h2 id="title"></h2><div id="body" class="bubble"></div><div id="buttons"></div><p id="alert" class="warn"></p></section></main>
<script>
let release,current;const $=s=>document.querySelector(s);const labels={menu:'メニュー',answer:'ボット回答',check:'確認案内',redirect:'別のLINE',handoff:'担当者'};
function show(rule){current=rule;$('#title').textContent=release.data.nodes[rule.sourceNodeId].label;$('#id').textContent=rule.sourceNodeId+' · '+labels[rule.sourceType];$('#alert').textContent=release.validation.warnings.filter(w=>w.node===rule.sourceNodeId).map(w=>w.code).join('\n');const flex=JSON.parse(rule.responseContent);$('#body').textContent=flex.body.contents.filter(c=>c.type==='text').slice(1).map(c=>c.text).join('');$('#buttons').replaceChildren();for(const c of flex.body.contents.filter(c=>c.type==='button')){const a=c.action,b=document.createElement('button');b.textContent=a.label;b.onclick=()=>{if(a.type==='uri'){$('#alert').textContent='誘導先リンク（プレビューでは移動しません）\n'+a.uri;return;}const next=release.rules.find(r=>r.keyword===a.data);if(next)show(next);else $('#alert').textContent='このボタンのイベント定義は作成済みです。Harnessのチャット状態更新処理への接続は未実装です。実際の状態は変更していません。\n'+a.data;};$('#buttons').append(b);}}
function list(){const q=$('#q').value.toLowerCase();$('#list').replaceChildren();for(const r of release.rules.filter(r=>(release.data.nodes[r.sourceNodeId].label+' '+r.sourceNodeId).toLowerCase().includes(q))){const b=document.createElement('button');b.textContent=release.data.nodes[r.sourceNodeId].label+' · '+labels[r.sourceType];b.onclick=()=>show(r);$('#list').append(b);}}
fetch('/release.json').then(r=>r.json()).then(r=>{release=r;$('#summary').textContent=r.releaseId+' ／ '+r.rules.length+'ノード ／ 構造エラー '+r.validation.errors.length+' ／ 確認事項 '+r.validation.warnings.length;list();show(r.rules.find(q=>q.sourceNodeId==='root'));});$('#q').oninput=list;
</script></body></html>
