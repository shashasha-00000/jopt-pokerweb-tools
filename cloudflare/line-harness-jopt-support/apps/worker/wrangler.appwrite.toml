# JOPT free-tier install. No R2 binding or paid storage subscription.
# This source fork must be deployed from source; do not apply vanilla bundles.
name = "line-harness-jopt-support"
main = "src/index.ts"
account_id = "4d9c9e5363f3e4e66214398c88afd9f4"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = "dist/client"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "line-harness-jopt-support"
database_id = "e66caeb0-aa14-4f4a-80f0-b18bf87229e9"

[[durable_objects.bindings]]
name = "TENANT_SCHEDULER"
class_name = "TenantScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TenantScheduler"]

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

[vars]
APPWRITE_ENDPOINT = "https://fra.cloud.appwrite.io/v1"
APPWRITE_PROJECT_ID = "6ad33813000dd5ab3dca"
APPWRITE_BUCKET_ID = "6ad338b3002987cffde2"
WORKER_NAME = "line-harness-jopt-support"
WORKER_URL = "https://line-harness-jopt-support.japanopenpoker.workers.dev"
ADMIN_ORIGIN = "https://line-harness-jopt-support.japanopenpoker.workers.dev"
ADMIN_COOKIE_SAMESITE = "Lax"
LINE_CHANNEL_ID = "2011834690"
LOG_RETENTION_DAYS = "0"
